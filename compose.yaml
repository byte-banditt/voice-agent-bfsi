services:
  agent:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      CRM_URL: http://crm:8001
      DATABASE_PATH: /data/voice_agent.db
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - agent-data:/data
    depends_on:
      crm:
        condition: service_healthy
  crm:
    build: .
    command: ["uvicorn", "app.crm:crm_app", "--host", "0.0.0.0", "--port", "8001"]
    env_file: .env
    environment:
      CRM_DATABASE_PATH: /data/crm.db
    ports:
      - "8001:8001"
    volumes:
      - crm-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/openapi.json')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  agent-data:
  crm-data:
