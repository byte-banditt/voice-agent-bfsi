[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent-bfsi"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.163.0",
  "uvicorn[standard]==0.54.0",
  "prometheus-client==0.26.0",
  "httpx==0.28.1",
  "python-dotenv==1.2.4",
  "PyYAML==6.0.3",
  "webrtcvad-wheels==2.0.14.post1",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx==0.28.1"]
real = ["faster-whisper==1.2.1", "piper-tts==1.8.0", "numpy==2.4.6", "av==18.0.0"]
privacy = ["presidio-analyzer==2.2.366", "presidio-anonymizer==2.2.366"]
evaluation = ["jiwer==4.0.0"]
simulator = ["websockets==17.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
