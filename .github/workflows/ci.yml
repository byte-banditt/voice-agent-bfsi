name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Record runner hardware
        run: |
          uname -a
          lscpu
          free -h
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q app tools tests
      - run: python -m pytest -ra
